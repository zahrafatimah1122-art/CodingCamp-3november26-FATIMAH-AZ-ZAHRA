<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Expense &amp; Budget Visualizer</h1>
      <button id="theme-toggle" class="btn-icon" type="button" aria-label="Toggle dark/light mode">🌙</button>
    </header>

    <section class="card balance-card">
      <p class="label">TOTAL BALANCE</p>
      <p id="total-balance" class="balance">$0.00</p>
    </section>

    <section class="card">
      <h2>Add Transaction</h2>
      <form id="transaction-form" novalidate>
        <label for="item-name">Item Name</label>
        <input type="text" id="item-name" placeholder="e.g. Coffee" autocomplete="off">

        <label for="amount">Amount</label>
        <input type="number" id="amount" placeholder="0.00" min="0" step="0.01">

        <label for="category">Category</label>
        <select id="category"></select>

        <p id="form-error" class="error" role="alert" hidden></p>
        <button type="submit" class="btn btn-primary">Add Transaction</button>
      </form>

      <div class="custom-category">
        <label for="new-category">Add custom category</label>
        <div class="row">
          <input type="text" id="new-category" placeholder="e.g. Health" autocomplete="off">
          <button type="button" id="add-category" class="btn btn-secondary">Add</button>
        </div>
      </div>
    </section>

    <div class="grid">
      <section class="card">
        <div class="list-header">
          <h2>Transactions</h2>
          <select id="sort" aria-label="Sort transactions">
            <option value="newest">Newest first</option>
            <option value="amount-desc">Amount: high → low</option>
            <option value="amount-asc">Amount: low → high</option>
            <option value="category">Category (A–Z)</option>
          </select>
        </div>
        <ul id="transaction-list" class="transaction-list"></ul>
        <p id="empty-state" class="empty">No transactions yet.</p>
      </section>

      <section class="card">
        <h2>Spending by Category</h2>
        <div class="chart-wrap">
          <canvas id="spending-chart"></canvas>
        </div>
        <p id="chart-empty" class="empty">Add a transaction to see the chart.</p>
      </section>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
